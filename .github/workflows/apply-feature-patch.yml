name: Apply implicit layers feature patch

on:
  push:
    branches:
      - feature/implicit-text-semantic-tools
    paths:
      - .github/workflows/apply-feature-patch.yml
      - tools/apply_implicit_layers.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/implicit-text-semantic-tools

      - name: Apply source patch
        run: python3 tools/apply_implicit_layers.py

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-src/app/src/main/java/ro/bibliotopicsearch/app/MainActivity.java project-src/app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Add implicit textual and semantic live layers"
            git push origin HEAD:feature/implicit-text-semantic-tools
          fi
