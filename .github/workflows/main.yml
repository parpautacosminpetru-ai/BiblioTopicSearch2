name: Build current BiblioTopicSearch source APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test cartography SQL against SQLite
        run: python3 -m unittest discover -s project-src/sql-tests -p 'test_*.py'

      - name: Run unit tests
        run: gradle --no-daemon -p project-src :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon -p project-src :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project-src/app/build/outputs/apk/debug/app-debug.apk \
             output/BiblioTopicSearch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTopicSearch-APK
          path: output/BiblioTopicSearch.apk
          if-no-files-found: error
