name: Build BiblioTopicSearch APK

on:
  workflow_dispatch:
  push:
    branches: [feature/bibliotopicsearch-pro]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip BiblioTopicSearch
        run: |
          rm -rf project
          mkdir -p project
          unzip -q BiblioTopicSearch_FINAL.zip -d project
          echo "Project contents:"
          ls -la project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          gradle --no-daemon -p project :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk \
             output/BiblioTopicSearch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTopicSearch-APK
          path: output/BiblioTopicSearch.apk
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTopicSearch-Source
          path: BiblioTopicSearch_FINAL.zip
          if-no-files-found: error
