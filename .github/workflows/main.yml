name: Biblio Paleografie - test and build

on:
  push:
    branches:
      - fix/paleography-verified-1.4.2
  workflow_dispatch:

concurrency:
  group: aug11-ocr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;35.0.0"
      - name: Bundle official offline OCR models (tessdata_fast 4.1.0)
        shell: bash
        run: |
          set -euo pipefail
          MODELS=project-src/app/src/main/assets/ocr_models
          mkdir -p "$MODELS"
          BASE=https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0
          for model in ron eng rus ell grc ara heb hin chi_sim chi_tra jpn kor; do
            curl --fail --silent --show-error --location --retry 3 "$BASE/$model.traineddata" -o "$MODELS/$model.traineddata"
            test "$(wc -c < "$MODELS/$model.traineddata")" -gt 100000
          done
          curl --fail --silent --show-error --location --retry 3 "$BASE/LICENSE" -o "$MODELS/LICENSE"
          (cd "$MODELS" && sha256sum *.traineddata > SHA256SUMS)
      - name: Cache test signing key (debug only)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: biblio-paleography-universal-debug-key-v1
      - name: Ensure test signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Biblio Test,C=RO"
          fi
      - name: Unit tests and build
        run: gradle --no-daemon -p project-src :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTopicSearch-test-results
          path: project-src/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Verify package and offline permissions
        shell: bash
        run: |
          APK=project-src/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ro.bibliotopicsearch.paleography.universal' versionCode='25' versionName='1.5.0'"
          unzip -Z1 "$APK" > apk-files.txt
          for model in ron eng rus ell grc ara heb hin chi_sim chi_tra jpn kor; do
            grep -Fx "assets/ocr_models/$model.traineddata" apk-files.txt
          done
          "$AAPT" dump permissions "$APK" > permissions.txt
          cat permissions.txt
          if grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|RECORD_AUDIO)' permissions.txt; then exit 1; fi
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute Android instrumented tests (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: gradle --no-daemon -p project-src :app:connectedDebugAndroidTest
      - name: Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paleografie-Android-test-results
          path: project-src/app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Prepare APK
        run: |
          mkdir -p output
          cp project-src/app/build/outputs/apk/debug/app-debug.apk output/Biblio-Paleografie-1.5.0.apk
          cd output
          sha256sum Biblio-Paleografie-1.5.0.apk > Biblio-Paleografie-1.5.0.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Biblio-Paleografie-1.5.0
          path: output/
          if-no-files-found: error
