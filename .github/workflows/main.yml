name: Build August 11 MultiMap OCR

on:
  push:
    branches:
      - feature/aug11-multimap-live-ocr-20261124
  workflow_dispatch:

concurrency:
  group: aug11-ocr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;35.0.0"
      - name: Unit tests and build
        run: gradle --no-daemon -p project-src :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTopicSearch-test-results
          path: project-src/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Prepare APK
        run: |
          mkdir -p output
          cp project-src/app/build/outputs/apk/debug/app-debug.apk output/BiblioTopicSearch-Aug11-MultiMap-OCR-1.1.9.apk
          cd output
          sha256sum BiblioTopicSearch-Aug11-MultiMap-OCR-1.1.9.apk > BiblioTopicSearch-Aug11-MultiMap-OCR-1.1.9.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTopicSearch-Aug11-MultiMap-OCR-1.1.9
          path: output/
          if-no-files-found: error
