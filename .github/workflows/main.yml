name: Build Lupa Semantica APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/semantic-final

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip base project
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q BiblioTopicSearch_FINAL.zip -d project
          test -d project/app
          test -f project/app/src/main/AndroidManifest.xml

      - name: Rebuild professional semantic source
        run: |
          set -euo pipefail
          cat semantic-final/patch/semantic-final-*.part > /tmp/semantic-final.patch
          test "$(wc -c < /tmp/semantic-final.patch)" -gt 90000
          git -C project init -q
          git -C project apply --exclude=README.md --check /tmp/semantic-final.patch
          git -C project apply --exclude=README.md /tmp/semantic-final.patch

          cp semantic-final/notebook/app/src/main/java/ro/bibliotopicsearch/app/NotebookActivity.java \
            project/app/src/main/java/ro/bibliotopicsearch/app/NotebookActivity.java
          cp semantic-final/notebook/app/src/main/java/ro/bibliotopicsearch/app/NotebookStore.java \
            project/app/src/main/java/ro/bibliotopicsearch/app/NotebookStore.java
          git -C project apply --check ../semantic-final/notebook/integration.patch
          git -C project apply ../semantic-final/notebook/integration.patch
          git -C project apply --check ../semantic-final/patch/live-ocr-stabilization.patch
          git -C project apply ../semantic-final/patch/live-ocr-stabilization.patch
          git -C project apply --check ../semantic-final/patch/semantic-precision-v23.patch
          git -C project apply ../semantic-final/patch/semantic-precision-v23.patch

          cat semantic-final/patch/pro-v30-*.part > /tmp/pro-v30.patch
          echo '42b161c2bef3822f429b2997fcc8a28f0cac91bec96f7ee48b0e21035b721756  /tmp/pro-v30.patch' | sha256sum -c -
          git -C project apply --check /tmp/pro-v30.patch
          git -C project apply /tmp/pro-v30.patch

          git -C project apply --check ../semantic-final/patch/semantic-detection-v31.patch
          git -C project apply ../semantic-final/patch/semantic-detection-v31.patch

          cp semantic-final/README_FINAL.md project/README.md
          cp semantic-final/MODEL_NOTICE.md project/MODEL_NOTICE.md
          sed -i 's/minSdk = 23/minSdk = 24/' project/app/build.gradle.kts
          sed -i 's/versionCode = 22/versionCode = 31/; s/versionName = "2.2.0"/versionName = "3.1.0"/' project/app/build.gradle.kts

          grep -q 'versionName = "3.1.0"' project/app/build.gradle.kts
          grep -q 'versionCode = 31' project/app/build.gradle.kts
          grep -q 'minSdk = 24' project/app/build.gradle.kts
          grep -q 'onnxruntime-android:1.26.0' project/app/build.gradle.kts
          grep -q 'STRATEGY_KEEP_ONLY_LATEST' project/app/src/main/java/ro/bibliotopicsearch/app/MainActivity.java
          grep -q 'MAX_ACTIVE_QUERIES = 8' project/app/src/main/java/ro/bibliotopicsearch/app/MainActivity.java
          grep -q 'semanticExecutor = Executors.newSingleThreadExecutor' project/app/src/main/java/ro/bibliotopicsearch/app/MainActivity.java
          grep -q 'enqueueSemanticFrame' project/app/src/main/java/ro/bibliotopicsearch/app/MainActivity.java
          grep -q 'pendingSemanticFrame = frame' project/app/src/main/java/ro/bibliotopicsearch/app/MainActivity.java
          grep -q 'intent.putStringArrayListExtra("semantic_queries"' project/app/src/main/java/ro/bibliotopicsearch/app/MainActivity.java
          grep -q 'analyzeQueries' project/app/src/main/java/ro/bibliotopicsearch/app/semantic/SemanticAnalyzer.java
          grep -q 'DIRECT_LITERAL_CONFIDENCE' project/app/src/main/java/ro/bibliotopicsearch/app/semantic/SemanticAnalyzer.java
          grep -q 'baseQueryThreshold(int specificity)' project/app/src/main/java/ro/bibliotopicsearch/app/semantic/SemanticAnalyzer.java
          grep -q 'specificity <= 1) return 0.360f' project/app/src/main/java/ro/bibliotopicsearch/app/semantic/SemanticAnalyzer.java
          grep -q 'explicitSurfaceMatch(query, evidence)' project/app/src/main/java/ro/bibliotopicsearch/app/semantic/SemanticAnalyzer.java
          if grep -q 'AppPrefs.precision(context)' project/app/src/main/java/ro/bibliotopicsearch/app/semantic/SemanticAnalyzer.java; then
            echo 'Camera targeting/smoothing must not alter semantic acceptance thresholds' >&2
            exit 1
          fi
          grep -q 'evidenceRelevance' project/app/src/main/java/ro/bibliotopicsearch/app/MatchHit.java
          grep -q 'ZOOM: NUCLEU' project/app/src/main/java/ro/bibliotopicsearch/app/MainActivity.java
          grep -q 'runSearches' project/app/src/main/java/ro/bibliotopicsearch/app/NotebookActivity.java
          if grep -q 'private EditText searchInput' project/app/src/main/java/ro/bibliotopicsearch/app/NotebookActivity.java; then
            echo 'Notebook must not own a second semantic search bar' >&2
            exit 1
          fi
          grep -q 'xmlns:tools="http://schemas.android.com/tools"' project/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' project/app/src/main/AndroidManifest.xml
          grep -q 'tools:node="remove"' project/app/src/main/AndroidManifest.xml

      - name: Install pinned semantic model assets
        env:
          MODEL_REV: acc85025f9078147bcc1ce55a4ddb9ec5e0d87cf
        run: |
          set -euo pipefail
          ASSET_DIR=project/app/src/main/assets/semantic
          BASE="https://huggingface.co/sentence-transformers/distiluse-base-multilingual-cased-v2/resolve/${MODEL_REV}"
          mkdir -p "$ASSET_DIR"
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 \
            "$BASE/onnx/model_qint8_arm64.onnx?download=true" \
            -o "$ASSET_DIR/semantic_model.onnx"
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 \
            "$BASE/vocab.txt?download=true" \
            -o "$ASSET_DIR/vocab.txt"
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 \
            "$BASE/2_Dense/model.safetensors?download=true" \
            -o "$ASSET_DIR/dense_model.safetensors"
          echo 'c78c64bb0446ceb7086d2de24c2f4297e7a909eb457b4f68e5fdb6ab19f285c0  project/app/src/main/assets/semantic/semantic_model.onnx' | sha256sum -c -
          echo '0a21b1ce908e772ebf09f93c20ca09524c32706e9918d9c0169a3f0663b191ed  project/app/src/main/assets/semantic/dense_model.safetensors' | sha256sum -c -
          test -s "$ASSET_DIR/vocab.txt"

      - name: Upload professional source without model binaries
        uses: actions/upload-artifact@v4
        with:
          name: Lupa-Semantica-3.1-SOURCE
          path: |
            project
            !project/.git
            !project/app/src/main/assets/semantic/semantic_model.onnx
            !project/app/src/main/assets/semantic/dense_model.safetensors
            !project/app/src/main/assets/semantic/vocab.txt
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon -p project :app:assembleDebug

      - name: Verify professional offline APK
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/semantic/semantic_model.onnx'
          unzip -l "$APK" | grep -q 'assets/semantic/vocab.txt'
          unzip -l "$APK" | grep -q 'assets/semantic/dense_model.safetensors'
          if grep -R -q 'android.permission.INTERNET' project/app/build/intermediates/merged_manifest* project/app/build/intermediates/merged_manifests* 2>/dev/null; then
            echo 'Merged APK manifest unexpectedly requests INTERNET' >&2
            exit 1
          fi
          if grep -R -q -E 'https?://|HttpURLConnection|OkHttpClient|Retrofit|java.net.URL' project/app/src/main/java 2>/dev/null; then
            echo 'Runtime network reference found in app source' >&2
            exit 1
          fi
          grep -R -q 'NotebookActivity' project/app/build/intermediates/merged_manifest* project/app/build/intermediates/merged_manifests*
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/Lupa-Semantica-3.1.apk
          sha256sum output/Lupa-Semantica-3.1.apk | tee output/SHA256SUMS.txt
          printf '%s\n' \
            'Lupa Semantica 3.1 Professional' \
            'Runtime: fully offline' \
            'Network permission: none in merged APK' \
            'One semantic input bar' \
            'Up to 8 themes/ideas active in parallel' \
            'Legend: stable color per active theme' \
            'Output: highlight on exact source span only' \
            'Zoom: SPAN -> RELEVANCE -> NUCLEUS' \
            'Filtering: broad theme = wider semantic field; narrower query = stricter filter' \
            'Literal explicit source occurrence bypasses embedding rejection' \
            'Camera targeting/smoothing does not alter semantic thresholds' \
            'Pipeline: CameraX OCR latest-only + separate semantic worker' \
            'Backpressure: one pending semantic frame, newer frame replaces older pending frame' \
            'Efficiency: OCR-unit embeddings computed once per frame for all active queries' \
            'Notebook: uses the same active query set; no second search field' \
            'Generation: none; no summaries, paraphrases or interpretations' \
            > output/OFFLINE-VERIFICATION.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lupa-Semantica-3.1-APK
          path: output
          if-no-files-found: error
