name: Publish final APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build final debug APK
        run: gradle --no-daemon -p project-src :app:assembleDebug

      - name: Prepare direct-download APK
        run: |
          mkdir -p dist
          cp project-src/app/build/outputs/apk/debug/app-debug.apk dist/BiblioTopicSearch_FINAL.apk
          sha256sum dist/BiblioTopicSearch_FINAL.apk > dist/BiblioTopicSearch_FINAL.apk.sha256

      - name: Commit final APK to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/BiblioTopicSearch_FINAL.apk dist/BiblioTopicSearch_FINAL.apk.sha256
          if git diff --cached --quiet; then
            echo "Final APK is already current"
          else
            git commit -m "Publish final BiblioTopicSearch APK"
            git push origin HEAD:main
          fi
