name: Build and Publish Lupa Semantica 2.1 APK

on:
  push:
    branches:
      - agent/lupa-semantica-2-1-final
    paths-ignore:
      - '.github-build-artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/lupa-semantica-2-1-final

      - name: Verify final source
        run: |
          echo "e0ce999c23de7ea4e27b5539525d978353d5ca3ac0680689e640dd2b002a2db1  BiblioTopicSearch_FINAL.zip" | sha256sum -c -
          unzip -t BiblioTopicSearch_FINAL.zip
          rm -rf project
          mkdir -p project
          unzip -q BiblioTopicSearch_FINAL.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build Debug APK
        run: gradle --no-daemon -p project :app:assembleDebug

      - name: Publish APK to branch
        run: |
          mkdir -p .github-build-artifacts
          cp project/app/build/outputs/apk/debug/app-debug.apk .github-build-artifacts/Lupa-Semantica-2.1.apk
          sha256sum .github-build-artifacts/Lupa-Semantica-2.1.apk > .github-build-artifacts/Lupa-Semantica-2.1.apk.sha256
          printf 'Lupa Semantica 2.1\nSource SHA-256: e0ce999c23de7ea4e27b5539525d978353d5ca3ac0680689e640dd2b002a2db1\nBuild: GitHub Actions success\n' > .github-build-artifacts/BUILD_SUCCESS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github-build-artifacts
          git commit -m 'Publish Lupă Semantică 2.1 APK [skip ci]'
          git push origin HEAD:agent/lupa-semantica-2-1-final
