name: Beta5 live index inspector validation

on:
  push:
    branches:
      - feature/beta5-indexuri-context-live-20261115
  pull_request:
    branches:
      - feature/bibliotopicsearch-2-deterministic-detector-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
      - name: Android API
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Unit + SQL tests
        run: |
          python3 -m unittest discover -s project-src/sql-tests -p 'test_*.py'
          gradle --no-daemon -p project-src :app:testDebugUnitTest
      - name: Assemble APK
        run: gradle --no-daemon -p project-src :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Beta5-context-live-debug-apk
          path: project-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
