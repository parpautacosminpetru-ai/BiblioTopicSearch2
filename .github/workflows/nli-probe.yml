name: Probe Professional NLI

on:
  push:
    branches:
      - agent/nli-professional-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tokenizer probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy<2' \
            'onnx==1.17.0' \
            'onnxruntime==1.20.1' \
            'onnxruntime-extensions==0.14.0' \
            'transformers==4.49.0' \
            'sentencepiece==0.2.0' \
            'huggingface_hub==0.28.1'
      - name: Probe XLM-R pair tokenizer
        run: python semantic-final/pro/nli_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: nli-tokenizer-probe
          path: /tmp/nli_tokenizer.onnx
          if-no-files-found: error
