name: Build source-based BiblioTopicSearch

on:
  push:
    branches:
      - main
      - feature/implicit-text-semantic-tools
      - feature/punctuation-colors
      - feature/universal-parallel-detection
      - fix/verified-capture-integrity
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test cartography SQL against SQLite
        run: python3 -m unittest discover -s project-src/sql-tests -p 'test_*.py'

      - name: Run unit tests
        run: gradle --no-daemon -p project-src :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon -p project-src :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project-src/app/build/outputs/apk/debug/app-debug.apk output/BiblioTopicSearch-implicit-tools.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTopicSearch-implicit-tools-APK
          path: output/BiblioTopicSearch-implicit-tools.apk
          if-no-files-found: error

  android-instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # Emulator startup + 7 real-device-style tests can exceed 35m on hosted runners.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM for Android emulator
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android SQLite / storage instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle --no-daemon -p project-src :app:connectedDebugAndroidTest
